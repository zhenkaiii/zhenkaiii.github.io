<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Story / Project-Based Narratives — Interview Ready</title>
<style>
  :root{
    --bg:#0f1220; --panel:#171a2b; --ink:#e7e9f7; --muted:#aab0d5;
    --accent:#7c9cff; --ok:#57d39b; --warn:#ffd166; --bad:#ff6b6b;
    --code-bg:#0b0e19; --code-border:#252a45; --kbd:#222742;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 80px}
  header{display:flex;align-items:center;gap:16px;margin-bottom:10px;flex-wrap:wrap}
  .badge{font-size:12px;border:1px solid var(--code-border);color:var(--muted);padding:3px 8px;border-radius:999px}
  h1{font-size:28px;margin:0}
  h2{margin:28px 0 10px;font-size:20px}
  h3{margin:20px 0 8px;font-size:17px;color:var(--accent)}
  p,li{color:var(--ink);opacity:.92;line-height:1.7}
  ul{padding-left:20px;margin:10px 0}
  li{margin-bottom:6px}
  .panel{background:var(--panel);border:1px solid var(--code-border);border-radius:16px;padding:18px;margin:12px 0}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:14px}
  pre{background:var(--code-bg);border:1px solid var(--code-border);border-radius:14px;padding:16px;overflow:auto;font-size:14px;line-height:1.6}
  .callout{border-left:4px solid var(--accent);padding:10px 12px;background:rgba(124,156,255,.08);border-radius:8px;margin:14px 0}
  .callout.warn{border-left-color:var(--warn)}
  .callout.ok{border-left-color:var(--ok)}
  .callout.bad{border-left-color:var(--bad)}
  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px}
  th{text-align:left;padding:10px 14px;border-bottom:2px solid var(--code-border);color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
  td{padding:10px 14px;border-bottom:1px solid var(--code-border)}
  .diagram{background:var(--code-bg);border:1px solid var(--code-border);border-radius:14px;padding:20px;margin:14px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:14px;line-height:1.6;overflow-x:auto;white-space:pre}
  .footer{margin-top:36px;color:var(--muted);font-size:12px}
  .subtitle{color:var(--muted);font-size:14px;margin:4px 0 24px}
  .story-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .story-num{background:var(--accent);color:var(--bg);font-weight:700;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .story-meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .tag.time{background:rgba(87,211,155,.15);color:var(--ok)}
  .tag.domain{background:rgba(124,156,255,.15);color:var(--accent)}
  .tag.use{background:rgba(255,209,102,.15);color:var(--warn)}
  .spoken{font-style:italic;color:var(--ink);opacity:.88;line-height:1.8}
  .section-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:18px 0 6px}
</style>
</head>
<body>

<div id="gate" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f1220">
  <div style="text-align:center">
    <p style="color:#aab0d5;font-family:system-ui;margin-bottom:12px">This page is encrypted.</p>
    <input id="pw" type="password" placeholder="passphrase" autofocus
      style="padding:10px 16px;border-radius:8px;border:1px solid #252a45;background:#171a2b;color:#e7e9f7;font-size:16px;font-family:system-ui;outline:none;width:220px"
      onkeydown="if(event.key==='Enter')unlock()">
    <br><button onclick="unlock()"
      style="margin-top:10px;padding:8px 24px;border-radius:8px;border:none;background:#7c9cff;color:#0f1220;font-weight:700;cursor:pointer;font-family:system-ui">Enter</button>
    <p id="err" style="color:#ff6b6b;font-family:system-ui;margin-top:8px;display:none">Wrong passphrase</p>
  </div>
</div>
<div id="content-wrap"></div>
<script>
async function unlock(){
  try{
    const pw=document.getElementById('pw').value;
    const blob=document.getElementById('enc-blob').textContent.trim();
    const raw=Uint8Array.from(atob(blob),c=>c.charCodeAt(0));
    const salt=raw.slice(0,16);
    const iv=raw.slice(16,28);
    const ct=raw.slice(28);
    const enc=new TextEncoder();
    const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    const html=new TextDecoder().decode(pt);
    document.getElementById('gate').style.display='none';
    document.getElementById('content-wrap').innerHTML=html;
    document.getElementById('content-wrap').style.display='block';
    sessionStorage.setItem('k_auth_v2',btoa(pw));
  }catch(e){document.getElementById('err').style.display='block'}
}
(async()=>{
  const cached=sessionStorage.getItem('k_auth_v2');
  if(cached){document.getElementById('pw').value=atob(cached);await unlock()}
})();
</script>
